# Android Pocket — STANDARD GITHUB-HOSTED RUNNERS ONLY.
# Put this single file at .github/workflows/build.yml and run manually.
# Uses ubuntu-24.04 and macos-26; no self-hosted or larger runner is required.
# Android + kernel + guest drivers are PREBUILT, pinned and SHA-256 checked.
# The UTM-based iOS app and its JIT engine dependencies compile on macos-26.
# Cold dependency builds can take hours; successful results are cached.
# Normal GitHub Actions quotas/billing apply, especially in private repositories.
# Requires working on-device JIT. Does not supply a JIT enabler or hypervisor.
# Experimental: compilation and boot on iPhone/LiveContainer are unverified.
# Guest low-memory mode, zRAM and resolution use the upstream boot settings.
# zRAM logical size is upstream's 50% of guest RAM, NOT additional physical RAM.
# Graphics acceleration is experimental; software mode is available at dispatch.
# No source tree, extra repository files, Apple signing secrets or local Mac needed.

name: Android Pocket - standard GitHub runners

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build.yml'
  workflow_dispatch:
    inputs:
      guest_ram:
        description: 'Guest RAM in MiB (emulator needs additional RAM)'
        type: choice
        options: ['2048', '1536', '2560']
        default: '2048'
      graphics:
        description: 'Experimental VirGL acceleration, or software compatibility mode'
        type: choice
        options: ['virgl', 'software']
        default: virgl
      resolution:
        description: 'Lower resolution reduces graphics work'
        type: choice
        options: ['576x1024', '720x1280', '360x640']
        default: '576x1024'
      rebuild_ios_dependencies:
        description: 'Ignore cached iOS dependencies'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: android-pocket-${{ github.ref }}
  cancel-in-progress: false

env:
  UTM_REV: 535d6592a8bdc22b48de53703a371b80bf60d587
  ANDROID_URL: https://github.com/jqssun/android-lineage-qemu/releases/download/v2026.09.17/UTM-VM-lineage-23.2-20260917-jqssun-virtio_arm64only.zip
  ANDROID_SHA256: 0a50afc821d905848b4560c33a5a706e6aee5ac414f85b31f9e52fc1ffabbd61

defaults:
  run:
    shell: bash

jobs:
  android:
    name: Prepare prebuilt Android on standard runner
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Download and verify pinned Android VM
        run: |
          set -euo pipefail
          mkdir -p android-evidence android-output
          curl --fail --location --retry 5 --retry-all-errors "$ANDROID_URL" -o android.zip
          echo "$ANDROID_SHA256  android.zip" | sha256sum --check
          printf '%s\n' "$ANDROID_URL" "$ANDROID_SHA256" > android-evidence/prebuilt-source.txt
          unzip -q android.zip -d vm
          rm android.zip

      - name: Install isolated guest-image editing tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libguestfs-tools grub-common qemu-system-x86 linux-image-generic
          # The runner's boot kernel may be absent or readable only by root.
          # Give supermin an explicit, readable kernel and its matching modules.
          pocket_kernel=$(find /boot -maxdepth 1 -name 'vmlinuz-*-generic' -print | sort -V | tail -n 1)
          test -n "$pocket_kernel"
          pocket_kernel_version="${pocket_kernel##*/vmlinuz-}"
          test -d "/lib/modules/$pocket_kernel_version"
          mkdir -p "$RUNNER_TEMP/pocket-guestfs" "$RUNNER_TEMP/pocket-guestfs-cache"
          sudo install -m 0644 "$pocket_kernel" "$RUNNER_TEMP/pocket-guestfs/vmlinuz-$pocket_kernel_version"
          echo "SUPERMIN_KERNEL=$RUNNER_TEMP/pocket-guestfs/vmlinuz-$pocket_kernel_version" >> "$GITHUB_ENV"
          echo "SUPERMIN_KERNEL_VERSION=$pocket_kernel_version" >> "$GITHUB_ENV"
          echo "SUPERMIN_MODULES=/lib/modules/$pocket_kernel_version" >> "$GITHUB_ENV"
          echo "LIBGUESTFS_CACHEDIR=$RUNNER_TEMP/pocket-guestfs-cache" >> "$GITHUB_ENV"

      - name: Verify guestfs appliance before editing Android
        env:
          LIBGUESTFS_BACKEND: direct
          LIBGUESTFS_DEBUG: '1'
          LIBGUESTFS_TRACE: '1'
        run: |
          set -euo pipefail
          timeout 300 libguestfs-test-tool 2>&1 | tee android-evidence/guestfs-appliance.log

      - name: Configure guest boot settings without mounting its filesystem on the host
        env:
          POCKET_RESOLUTION: ${{ inputs.resolution || '576x1024' }}
          LIBGUESTFS_BACKEND: direct
        run: |
          set -euo pipefail
          python3 - <<'PYCODE'
          import os, subprocess
          from pathlib import Path
          disks = list(Path('vm').rglob('vda.qcow2'))
          assert len(disks) == 1, 'Expected one boot disk'
          disk = str(disks[0].resolve())
          def guest(*args, readonly=False):
              cmd = ['guestfish'] + (['--ro'] if readonly else []) + ['-a', disk, 'run', ':'] + list(args)
              return subprocess.check_output(cmd, text=True)
          filesystems = guest('list-filesystems', readonly=True)
          partitions = [line.split(':', 1)[0] for line in filesystems.splitlines() if ':' in line]
          persist = []
          for part in partitions:
              try:
                  label = guest('vfs-label', part, readonly=True).strip()
              except subprocess.CalledProcessError:
                  continue
              if label.lower() == 'persist':
                  persist.append(part)
          assert len(persist) == 1, 'Cannot identify persist partition; refusing to alter another partition'
          envfile = str(Path('android-evidence/grubenv').resolve())
          guest('mount-ro', persist[0], '/', ':', 'download', '/grubenv', envfile, readonly=True)
          subprocess.run(['grub-editenv', envfile, 'set', 'android_zram=1',
              'android_low_perf=1', 'android_nobootanim=1', 'android_lcd_density=240',
              'grub_timeout=2', 'kms_display_resolution='+os.environ['POCKET_RESOLUTION']], check=True)
          # Uses upstream zRAM sizing (50% logical swap size); no kernel or driver rebuild.
          guest('mount', persist[0], '/', ':', 'upload', envfile, '/grubenv', ':', 'sync')
          Path('android-evidence/guest-settings.txt').write_text(
              subprocess.check_output(['grub-editenv', envfile, 'list'], text=True))
          PYCODE

      - name: Configure iPhone VM profile and package
        env:
          POCKET_RAM: ${{ inputs.guest_ram || '2048' }}
          POCKET_GRAPHICS: ${{ inputs.graphics || 'virgl' }}
        run: |
          set -euo pipefail
          python3 - <<'PYCODE'
          from pathlib import Path
          import os, plistlib, zipfile, uuid
          bundles = list(Path('vm').rglob('*.utm'))
          assert len(bundles) == 1, 'Expected one .utm bundle'
          vm = bundles[0]
          p = vm/'config.plist'
          c = plistlib.loads(p.read_bytes())
          c['Information'].update(Name='Android Pocket', UUID=str(uuid.uuid4()),
              Notes='Prebuilt LineageOS 23.2. JIT required. No iOS hypervisor. Device benchmarks needed.')
          c['System'].update(CPU='max', CPUCount=2, ForceMulticore=True,
              MemorySize=int(os.environ['POCKET_RAM']), JITCacheSize=128)
          c['QEMU'].update(Hypervisor=False, TSO=False, BalloonDevice=False)
          c['Input']['UsbSharing'] = False
          c['Sharing']['DirectoryShareMode'] = 'None'
          for display in c['Display']:
              display.update(Hardware='virtio-gpu-gl-pci' if os.environ['POCKET_GRAPHICS']=='virgl' else 'virtio-gpu-pci',
                             DynamicResolution=False, NativeResolution=False)
          for network in c['Network']:
              for forward in network.get('PortForward', []):
                  forward['HostAddress'] = '127.0.0.1'
          p.write_bytes(plistlib.dumps(c))
          for drive in c['Drive']:
              assert (vm/'Data'/drive['ImageName']).is_file(), 'Missing VM drive'
          with zipfile.ZipFile('android-output/AndroidPocket-vm.zip','w',zipfile.ZIP_DEFLATED,compresslevel=1) as z:
              for f in vm.rglob('*'):
                  if f.is_file():
                      z.write(f, Path('AndroidPocket.utm')/f.relative_to(vm))
          PYCODE

      - uses: actions/upload-artifact@v4
        with:
          name: android-vm
          path: android-output/AndroidPocket-vm.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Preserve image provenance and settings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-evidence
          path: android-evidence/
          if-no-files-found: warn
          retention-days: 7

  ios:
    name: Compile JIT-enabled iOS engine
    runs-on: macos-26
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          repository: utmapp/UTM
          ref: ${{ env.UTM_REV }}
          path: utm
          persist-credentials: false
          submodules: recursive

      - name: Record SDK and source versions
        working-directory: utm
        run: |
          set -euo pipefail
          mkdir -p evidence
          xcodebuild -version | tee evidence/xcode.txt
          xcrun --sdk iphoneos --show-sdk-version >> evidence/xcode.txt
          git rev-parse HEAD > evidence/utm-revision.txt
          cp patches/sources evidence/dependency-sources.txt

      - name: Install native build requirements
        run: |
          set -euo pipefail
          brew install bison pkg-config gettext glib-utils libgpg-error nasm make meson cmake
          brew install llvm spirv-llvm-translator spirv-tools libxcb libxrandr
pkg-config --modversion SPIRV-Tools
          python3 -m pip install --break-system-packages --user six pyparsing pyyaml setuptools distlib mako
          echo "$(brew --prefix bison)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix gettext)/bin" >> "$GITHUB_PATH"

      - name: Restore compiled engine dependencies
        id: sysroot
        if: ${{ !inputs.rebuild_ios_dependencies }}
        uses: actions/cache/restore@v4
        with:
          path: utm/sysroot-iOS-arm64
          key: pocket-ios-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.UTM_REV }}-${{ hashFiles('utm/evidence/xcode.txt') }}

      - name: Build QEMU, SPICE and upstream graphics dependencies
        if: steps.sysroot.outputs.cache-hit != 'true'
        working-directory: utm
        env:
          NCPU: '2'
        run: |
          set -eo pipefail
          # 'ios' is native JIT; 'ios-tci' would select the slower interpreter.
          ./scripts/build_dependencies.sh -p ios -a arm64 2>&1 | tee evidence/dependencies.log

      - name: Cache successful dependencies
        if: steps.sysroot.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: utm/sysroot-iOS-arm64
          key: pocket-ios-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.UTM_REV }}-${{ hashFiles('utm/evidence/xcode.txt') }}

      - name: Add first-launch import of the bundled Android VM
        working-directory: utm
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('Platform/iOS/UTMApp.swift')
          s = p.read_text()
          anchor = '                .externalDisplayAccessory()'
          assert s.count(anchor) == 1, 'Upstream app entry changed'
          s = s.replace(anchor, anchor + '''
                          .task {
                              await importPocketIfNeeded()
                          }''')
          anchor = '    /// Identifies the window group for `openWindow`.'
          assert s.count(anchor) == 1
          s = s.replace(anchor, '''    @MainActor
              private func importPocketIfNeeded() async {
                  #if !WITH_REMOTE
                  let key = "AndroidPocketImportedV1"
                  guard !UserDefaults.standard.bool(forKey: key), !data.busy else { return }
                  data.busy = true
                  defer { data.busy = false }
                  do {
                      let fm = FileManager.default
                      let dest = UTMData.defaultStorageUrl.appendingPathComponent("AndroidPocket.utm", isDirectory: true)
                      if !fm.fileExists(atPath: dest.path) {
                          guard let src = Bundle.main.url(forResource: "AndroidPocket", withExtension: "utm") else {
                              throw NSError(domain: "AndroidPocket", code: 1, userInfo: [NSLocalizedDescriptionKey: "Bundled Android image is missing."])
                          }
                          // Copy off the main thread, then atomically move the finished bundle.
                          let staging = UTMData.defaultStorageUrl.appendingPathComponent(".AndroidPocket-import", isDirectory: true)
                          try await Task.detached(priority: .userInitiated) {
                              let fm = FileManager.default
                              try fm.createDirectory(at: dest.deletingLastPathComponent(), withIntermediateDirectories: true)
                              if fm.fileExists(atPath: staging.path) { try fm.removeItem(at: staging) }
                              try fm.copyItem(at: src, to: staging)
                              try fm.moveItem(at: staging, to: dest)
                          }.value
                      }
                      await data.listRefresh()
                      UserDefaults.standard.set(true, forKey: key)
                  } catch {
                      data.alertItem = .message("Android import failed: \\(error.localizedDescription). Free storage and reopen the app to retry.")
                  }
                  #endif
              }

          ''' + anchor)
          p.write_text(s)
          PY
          git diff --binary > evidence/pocket-ios.patch

      - name: Compile Release app and stage unsigned IPA payload
        working-directory: utm
        run: |
          set -eo pipefail
          ./scripts/build_utm.sh -k iphoneos -s iOS -a arm64 -o Pocket 2>&1 | tee evidence/xcodebuild.log
          app_path="$PWD/Pocket.xcarchive/Products/Applications/UTM.app"
          test -d "$app_path"
          /usr/libexec/PlistBuddy -c 'Set :CFBundleDisplayName Android Pocket' "$app_path/Info.plist"
          mkdir -p staging/Payload
          cp -R "$app_path" staging/Payload/UTM.app
          # Remove stale app signature: sideloading must sign the finished payload.
          rm -rf staging/Payload/UTM.app/_CodeSignature
          rm -f staging/Payload/UTM.app/embedded.mobileprovision
          ditto -c -k --keepParent staging/Payload ios-payload.zip

      - uses: actions/upload-artifact@v4
        with:
          name: ios-payload
          path: utm/ios-payload.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Preserve iOS build logs and patch
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-evidence
          path: utm/evidence/
          if-no-files-found: warn
          retention-days: 7

  package:
    name: Assemble self-contained unsigned IPA
    needs: [android, ios]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: android-vm
          path: incoming
      - uses: actions/download-artifact@v4
        with:
          name: ios-payload
          path: incoming
      - name: Embed Android and validate bundle contents
        run: |
          set -euo pipefail
          mkdir -p staging output
          unzip -q incoming/ios-payload.zip -d staging
          unzip -q incoming/AndroidPocket-vm.zip -d staging/Payload/UTM.app
          python3 - <<'PY'
          import plistlib
          from pathlib import Path
          app = Path('staging/Payload/UTM.app')
          info = plistlib.loads((app/'Info.plist').read_bytes())
          assert (app/info['CFBundleExecutable']).is_file()
          vm = app/'AndroidPocket.utm'
          cfg = plistlib.loads((vm/'config.plist').read_bytes())
          assert cfg['System']['Architecture'] == 'aarch64'
          assert cfg['QEMU']['Hypervisor'] is False
          assert cfg['System']['ForceMulticore'] is True
          for drive in cfg['Drive']:
              assert (vm/'Data'/drive['ImageName']).is_file()
          print('Payload layout validated. Device boot and JIT have NOT been tested.')
          PY
          cd staging
          zip -q -r -1 -y ../output/AndroidPocket-unsigned.ipa Payload
          cd ../output
          sha256sum AndroidPocket-unsigned.ipa > SHA256SUMS.txt
          cat > INSTALL.txt <<'TXT'
          Android Pocket — experimental standard-runner build

          1. Sign/sideload AndroidPocket-unsigned.ipa with your usual tooling.
          2. Enable JIT for the app/container using a method supported by your iOS version.
          3. Open the app. First launch copies the bundled Android VM into writable storage.
             Allow room for both the embedded copy and the writable VM, plus userdata growth.
          4. Select Android Pocket and start it. First boot can be slow.

          This is a UTM-based app with a bundled LineageOS 23.2 VM, not a new emulator.
          No physical Mac is needed; GitHub's macOS runner builds the iOS app.
          ARM64-only guest: 32-bit-only and x86-only APKs are not supported.
          Google services are not bundled. JIT enablement is not supplied by this IPA.
          LiveContainer operation and graphics acceleration need on-device validation.

          If VirGL fails: shut down the VM, change Display hardware to virtio-gpu-pci,
          then reboot. This uses software rendering and may be substantially slower.
          If iOS kills the app: lower guest RAM to 1536 MiB. zRAM does not lift iOS limits.
          If multicore is unstable: shut down and disable Force Multicore in System settings.
          Resolution and low-memory mode can be adjusted in the guest boot manager.
          The preset is a starting point, not a measured fastest configuration.

          Android, its kernel, VirtIO/zRAM and guest graphics drivers come from a checksum-verified prebuilt image.
          The iOS app and its QEMU dependencies are compiled in GitHub Actions.
          It does not implement direct iPhone GPU passthrough or unlock a hypervisor.
          A successful Actions build validates compilation and packaging, not device boot.

          Sources: https://github.com/utmapp/UTM and https://github.com/LineageOS/android
          Android image: https://github.com/jqssun/android-lineage-qemu/releases/tag/v2026.09.17
          See android-build-evidence and ios-build-evidence for provenance and patches.
          Preserve upstream licenses and corresponding-source obligations if redistributing.
          TXT
          cat >> "$GITHUB_STEP_SUMMARY" <<'MD'
          ## Android Pocket build artifacts
          Download **AndroidPocket** for the unsigned IPA, checksum and install notes.
          **android-vm** contains the separately importable VM as well.
          **android-build-evidence** and **ios-build-evidence** contain image provenance, settings, source revisions and patches.

          Compilation/packaging complete; iPhone boot, LiveContainer compatibility and
          performance are unverified. JIT must be enabled on the device.
          MD
      - uses: actions/upload-artifact@v4
        with:
          name: AndroidPocket
          path: output/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7