          name: ios-payload
          path: utm/ios-payload.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Preserve iOS build logs and patch
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-evidence
          path: utm/evidence/
          if-no-files-found: warn
          retention-days: 7

  package:
    name: Assemble self-contained unsigned IPA
    needs: [android, ios]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: android-vm
          path: incoming
      - uses: actions/download-artifact@v4
        with:
          name: ios-payload
          path: incoming
      - name: Embed Android and validate bundle contents
        run: |
          set -euo pipefail
          mkdir -p staging output
          unzip -q incoming/ios-payload.zip -d staging
          unzip -q incoming/AndroidPocket-vm.zip -d staging/Payload/UTM.app
          python3 - <<'PY'
          import plistlib
          from pathlib import Path
          app = Path('staging/Payload/UTM.app')
          info = plistlib.loads((app/'Info.plist').read_bytes())
          assert (app/info['CFBundleExecutable']).is_file()
          vm = app/'AndroidPocket.utm'
          cfg = plistlib.loads((vm/'config.plist').read_bytes())
          assert cfg['System']['Architecture'] == 'aarch64'
          assert cfg['QEMU']['Hypervisor'] is False
          assert cfg['System']['ForceMulticore'] is True
          for drive in cfg['Drive']:
              assert (vm/'Data'/drive['ImageName']).is_file()
          print('Payload layout validated. Device boot and JIT have NOT been tested.')
          PY
          cd staging
          zip -q -r -1 -y ../output/AndroidPocket-unsigned.ipa Payload
          cd ../output
          sha256sum AndroidPocket-unsigned.ipa > SHA256SUMS.txt
          cat > INSTALL.txt <<'TXT'
          Android Pocket — experimental standard-runner build

          1. Sign/sideload AndroidPocket-unsigned.ipa with your usual tooling.
          2. Enable JIT for the app/container using a method supported by your iOS version.
          3. Open the app. First launch copies the bundled Android VM into writable storage.
             Allow room for both the embedded copy and the writable VM, plus userdata growth.
          4. Select Android Pocket and start it. First boot can be slow.

          This is a UTM-based app with a bundled LineageOS 23.2 VM, not a new emulator.
          No physical Mac is needed; GitHub's macOS runner builds the iOS app.
          ARM64-only guest: 32-bit-only and x86-only APKs are not supported.
          Google services are not bundled. JIT enablement is not supplied by this IPA.
          LiveContainer operation and graphics acceleration need on-device validation.

          If VirGL fails: shut down the VM, change Display hardware to virtio-gpu-pci,
          then reboot. This uses software rendering and may be substantially slower.
          If iOS kills the app: lower guest RAM to 1536 MiB. zRAM does not lift iOS limits.
          If multicore is unstable: shut down and disable Force Multicore in System settings.
          Resolution and low-memory mode can be adjusted in the guest boot manager.
          The preset is a starting point, not a measured fastest configuration.

          Android, its kernel, VirtIO/zRAM and guest graphics drivers come from a checksum-verified prebuilt image.
          The iOS app compiles using the previously built QEMU/SPICE/graphics dependency cache.
          Dependency rebuilds are disabled. The ios-dependencies artifact backs up those libraries.
          It does not implement direct iPhone GPU passthrough or unlock a hypervisor.
          A successful Actions build validates compilation and packaging, not device boot.

          Sources: https://github.com/utmapp/UTM and https://github.com/LineageOS/android
          Android image: https://github.com/jqssun/android-lineage-qemu/releases/tag/v2026.09.17
          See android-build-evidence and ios-build-evidence for provenance and patches.
          Preserve upstream licenses and corresponding-source obligations if redistributing.
          TXT
          cat >> "$GITHUB_STEP_SUMMARY" <<'MD'
          ## Android Pocket build artifacts
          Download **AndroidPocket** for the unsigned IPA, checksum and install notes.
          **android-vm** contains the separately importable VM as well.
          **android-build-evidence** and **ios-build-evidence** contain image provenance, settings, source revisions and patches.

          Compilation/packaging complete; iPhone boot, LiveContainer compatibility and
          performance are unverified. JIT must be enabled on the device.
          MD
      - uses: actions/upload-artifact@v4
        with:
          name: AndroidPocket
          path: output/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
