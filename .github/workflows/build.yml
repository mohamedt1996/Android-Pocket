# Android Pocket — STANDARD GITHUB-HOSTED RUNNERS ONLY.
# Put this single file at .github/workflows/build.yml and run manually.
# Uses ubuntu-24.04 and macos-26; no self-hosted or larger runner is required.
# Android + kernel + guest drivers are PREBUILT, pinned and SHA-256 checked.
# The UTM-based iOS app compiles on macos-26 against previously compiled JIT dependencies.
# Dependency rebuilds are disabled. Reuses the exact successful cache from the supplied logs.
# If the cache is unavailable, supply a previous dependency-artifact run ID or stop.
# Normal GitHub Actions quotas/billing apply, especially in private repositories.
# Requires working on-device JIT. Does not supply a JIT enabler or hypervisor.
# Experimental: compilation and boot on iPhone/LiveContainer are unverified.
# Guest low-memory mode, zRAM and resolution use the upstream boot settings.
# zRAM logical size is upstream's 50% of guest RAM, NOT additional physical RAM.
# Graphics acceleration is experimental; software mode is available at dispatch.
# No source tree, extra repository files, Apple signing secrets or local Mac needed.

name: Android Pocket - standard GitHub runners

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build.yml'
  workflow_dispatch:
    inputs:
      guest_ram:
        description: 'Guest RAM in MiB (emulator needs additional RAM)'
        type: choice
        options: ['2048', '1536', '2560']
        default: '2048'
      graphics:
        description: 'Experimental VirGL acceleration, or software compatibility mode'
        type: choice
        options: ['virgl', 'software']
        default: virgl
      resolution:
        description: 'Lower resolution reduces graphics work'
        type: choice
        options: ['576x1024', '720x1280', '360x640']
        default: '576x1024'
      dependency_run_id:
        description: 'Optional previous run containing ios-dependencies backup (only needed if cache is missing)'
        type: string
        default: '39053484309'

permissions:
  contents: read
  actions: read

concurrency:
  group: android-pocket-${{ github.ref }}
  cancel-in-progress: false

env:
  UTM_REV: 535d6592a8bdc22b48de53703a371b80bf60d587
  DEPENDENCY_CACHE_KEY: pocket-ios-v1-macOS-ARM64-535d6592a8bdc22b48de53703a371b80bf60d587-479d766cd62e6dd63a8fcc9d2837e45886d4f36956b7236263935507468bbd1a
  ANDROID_URL: https://github.com/jqssun/android-lineage-qemu/releases/download/v2026.09.17/UTM-VM-lineage-23.2-20260917-jqssun-virtio_arm64only.zip
  ANDROID_SHA256: 0a50afc821d905848b4560c33a5a706e6aee5ac414f85b31f9e52fc1ffabbd61

defaults:
  run:
    shell: bash

jobs:
  android:
    name: Prepare prebuilt Android on standard runner
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Download and verify pinned Android VM
        run: |
          set -euo pipefail
          mkdir -p android-evidence android-output
          curl --fail --location --retry 5 --retry-all-errors "$ANDROID_URL" -o android.zip
          echo "$ANDROID_SHA256  android.zip" | sha256sum --check
          printf '%s\n' "$ANDROID_URL" "$ANDROID_SHA256" > android-evidence/prebuilt-source.txt
          unzip -q android.zip -d vm
          rm android.zip

      - name: Install isolated guest-image editing tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libguestfs-tools grub-common qemu-system-x86 linux-image-generic
          # The runner's boot kernel may be absent or readable only by root.
          # Give supermin an explicit, readable kernel and its matching modules.
          pocket_kernel=$(find /boot -maxdepth 1 -name 'vmlinuz-*-generic' -print | sort -V | tail -n 1)
          test -n "$pocket_kernel"
          pocket_kernel_version="${pocket_kernel##*/vmlinuz-}"
          test -d "/lib/modules/$pocket_kernel_version"
          mkdir -p "$RUNNER_TEMP/pocket-guestfs" "$RUNNER_TEMP/pocket-guestfs-cache"
          sudo install -m 0644 "$pocket_kernel" "$RUNNER_TEMP/pocket-guestfs/vmlinuz-$pocket_kernel_version"
          echo "SUPERMIN_KERNEL=$RUNNER_TEMP/pocket-guestfs/vmlinuz-$pocket_kernel_version" >> "$GITHUB_ENV"
          echo "SUPERMIN_KERNEL_VERSION=$pocket_kernel_version" >> "$GITHUB_ENV"
          echo "SUPERMIN_MODULES=/lib/modules/$pocket_kernel_version" >> "$GITHUB_ENV"
          echo "LIBGUESTFS_CACHEDIR=$RUNNER_TEMP/pocket-guestfs-cache" >> "$GITHUB_ENV"
